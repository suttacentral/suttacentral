services:
  sc-flask:
    build:
      target: dev
    env_file:
      - server/env/.dev.env
    volumes:
      - ./client/:/opt/sc/frontend
    ports:
      - '5001:5000'
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the local pyproject.toml file with the container
        - action: sync
          path: ./server/pyproject.toml
          target: /opt/sc/sc-flask/pyproject.toml

        # Sync the local project source directory with the container
        - action: sync
          path: ./server/src
          target: /opt/sc/sc-flask/src

        # Sync the local project tests directory with the container
        - action: sync
          path: ./server/tests
          target: /opt/sc/sc-flask/tests

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./server/uv.lock


  sc-nginx:
    volumes:
      - ./client/:/opt/sc/static
    command: bash entry-point.dev.sh

  sc-arangodb:
    env_file:
      - server/env/.dev.env
    ports:
      - '8529:8529'

  sc-swagger:
    ports:
      - '8080:8080'

  sc-frontend:
    command: npm run dev
    ports:
      - '3000:3000'
    develop:
      watch:
        # Sync frontend files with the container
        - action: sync
          initial_sync: true
          path: ./client/
          target: /opt/sc/frontend/
        # Rebuild the image if dependencies or scripts change by checking package.json
        - action: rebuild
          path: ./client/package.json
