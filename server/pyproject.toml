[project]
name = "sc-flask"
version = "0.1.0"
description = "The backend python implementation for SuttaCentral.net"
readme = "README.md"
requires-python = "~=3.11.3"
dependencies = [
    "aksharamukha>=2.3,<3",
    "algoliasearch>=3.0.0,<4",
    "beautifulsoup4>=4.11.1,<5",
    "click>=8.1.3,<9",
    "decorator>=5.1.1,<6",
    "faker>=15.3.4,<16",
    "flasgger>=0.9.5,<0.10",
    "flask>=3.1.3,<4",
    "flask-caching>=2.0.1,<3",
    "flask-cors>=3.0.10,<4",
    "flask-restful>=0.3.9,<0.4",
    "fonttools>=4.38.0,<5",
    "jinja2>=3.1.2,<4",
    "lxml[cssselect]>=4.9.1,<5",
    "python-arango>=7.5.3,<8",
    "regex==2022.10.31",
    "requests>=2.31.0,<3",
    "sortedcontainers>=2.4.0,<3",
    "stripe>=6.4.0,<7",
    "tqdm>=4.64.1,<5",
    "unidecode>=1.3.7,<2",
    "uwsgi>=2.0.21,<3",
    "zhconv>=1.4.3,<2",
]

[dependency-groups]
dev = [
    "fawltydeps>=0.20.0,<0.21",
    "pytest>=7.2.0,<8",
    "pytest-flask>=1.2.0,<2",
    "pytest-sugar>=0.9.6,<0.10",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[tool.fawltydeps]
base_dir = "src/"
# ignore deps that are not directly imported
ignore_unused = [
    "fawltydeps", # used as CLI in `Makefile`
    "pytest-flask", # used within `@pytest.fixture`, such as in `conftest.py`
    "pytest-sugar", # modifies pytest output automatically
    "uwsgi", # used as CLI in `Makefile`, `entrypoint.sh`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
